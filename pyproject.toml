[tool.poetry]
name = "protocol-race"
version = "0.1.0"
description = "Protocol-RACE: AI security/data protection agent"
authors = ["Protocol-RACE Team <team@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.95"
uvicorn = {extras = ["standard"], version = "^0.22"}
scikit-learn = "^1.4"
numpy = "^1.26"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
joblib = "^1.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
